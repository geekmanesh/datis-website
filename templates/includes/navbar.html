<header id="header" class="header-effect-shrink bg-color-tertiary custom-header" data-plugin-options="{'stickyEnabled': true, 'stickyEffect': 'shrink', 'stickyEnableOnBoxed': true, 'stickyEnableOnMobile': true, 'stickyChangeLogo': true, 'stickyStartAt': 100, 'stickyHeaderContainerHeight': 83}">
    <div class="header-body border-0 box-shadow-none">
        <div class="header-top header-top-default bg-color-white border-bottom-0">
            <div class="container-fluid px-lg-4">
                <div class="header-row py-2">
                    <div class="header-column justify-content-start">
                        <div class="header-row">
                            <nav class="header-nav-top">
                                <ul class="nav nav-pills text-uppercase text-2">
                                    <li class="nav-item nav-item-anim-icon">
                                        <a class="px-0" href="mailto:mail@domain.com"><i class="far fa-envelope text-4 left-0"></i> porto@construction.com</a>
                                    </li>
                                    <li class="nav-item nav-item-anim-icon pl-md-4">
                                        <span class="d-none d-md-block">
                                            <i class="far fa-clock text-4"></i><span> شنبه - پنجشنبه 9:00 صبح - 6:00 عصر / جمعه - تعطیل</span>
                                        </span>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>

                    <div class="header-column justify-content-end">
                        <div class="header-row">
                            <ul class="header-social-icons social-icons d-none d-sm-block social-icons-clean">
                                <li class="social-icons-facebook"><a href="http://www.facebook.com/" target="_blank" title="Facebook"><i class="fab fa-facebook-f"></i></a></li>
                                <li class="social-icons-twitter"><a href="http://www.twitter.com/" target="_blank" title="Twitter"><i class="fab fa-twitter"></i></a></li>
                                <li class="social-icons-linkedin"><a href="http://www.linkedin.com/" target="_blank" title="Linkedin"><i class="fab fa-linkedin-in"></i></a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="header-container container-fluid bg-secondary px-0">
            <div class="header-row">
                <div class="header-column bg-color-primary flex-grow-0 px-3 px-lg-5">
                    <div class="header-row">
                        <div class="header-logo">
                            <a href="#">
                                <img alt="Porto" class="img-logo" width="100%" height="auto" src="img/demos/construction-2/logo-1.png">
                            </a>
                        </div>
                    </div>
                </div>
                <div class="header-column justify-content-end justify-content-lg-start px-lg-5">
                    <div class="header-row pr-3">
                        <div class="header-nav header-nav-links order-2 order-lg-1 header-nav-light-text flex-grow-0 justify-content-start">
                            <div class="header-nav-main header-nav-main-square header-nav-main-effect-2 header-nav-main-sub-effect-1 ">
                                <nav class="collapse">
                                    <ul class="nav nav-pills" id="mainNav">
                                        <li class="dropdown">
                                            <a class="dropdown-item active" href="{% url 'home' %}">
                                                خانه
                                            </a>
                                        </li>
                                        <li class="dropdown">
                                            <a class="dropdown-item" href="{% url 'about-us' %}">
                                                درباره ما
                                            </a>
                                        </li>
                                        <li class="dropdown">
                                            <a class="dropdown-item" href="{% url 'about-us' %}">
                                                پروژه ها
                                            </a>
                                        </li>
                                        <li class="dropdown">
                                            <a class="dropdown-item" href="{% url 'services' %}">
                                                خدمات
                                            </a>
                                        </li>
                                        <li class="dropdown">
                                            <a class="dropdown-item" href="{% url 'contact-us' %}">
                                                تماس با ما
                                            </a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                            <button class="btn header-btn-collapse-nav" data-toggle="collapse" data-target=".header-nav-main nav">
                                <i class="fas fa-bars"></i>
                            </button>
                        </div>
                        <div class="header-nav-features header-nav-features-light header-nav-features-no-border header-nav-features-lg-show-border order-1 order-lg-2">
                            <div class="header-nav-feature header-nav-features-search d-inline-flex">
                                <a href="#" class="header-nav-features-toggle" data-focus="headerSearch"><i class="fas fa-search header-nav-top-icon"></i></a>
                                <div class="header-nav-features-dropdown header-nav-features-dropdown-mobile-fixed" id="headerTopSearchDropdown">
                                    <form role="search" action="page-search-results.html" method="get">
                                        <div class="simple-search input-group">
                                            <input class="form-control text-1" id="headerSearch" name="q" type="search" value="" placeholder="جستجو ...">
                                            <span class="input-group-append">
                                                <button class="btn" type="submit">
                                                    <i class="fa fa-search header-nav-top-icon"></i>
                                                </button>
                                            </span>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="header-row d-none d-lg-inline-flex justify-content-end">
                <div class="order-1 order-lg-2 pr-4 d-none d-xl-block">
                    <div>
                        <div class="feature-box feature-box-style-2 align-items-center p-relative top-8 px-2">
                            <div class="feature-box-icon">
                                <i class="fas fa-mobile-alt text-9 p-relative bottom-7 text-color-light"></i>
                            </div>
                            <div class="feature-box-info pl-0">
                                <p class="text-color-light opacity-8 line-height-5 text-2 pb-0 mb-2">هم اکنون تماس بگیرید</p>
                                <p class="text-color-light font-weight-black line-height-3 mb-3 text-5 pb-0"><a href="tel:+1234567890" class="text-color-light text-color-hover-primary text-decoration-none ltr-text">(800) 123 4567</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
