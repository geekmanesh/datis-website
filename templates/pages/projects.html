{% extends 'base.html' %}

{% block content %}
<section class="page-header bg-color-tertiary custom-page-header page-header-modern page-header-background page-header-background-sm parallax mt-0" data-plugin-parallax data-plugin-options="{'speed': 1.2}" data-image-src="img/demos/construction-2/page-header.jpg">
	<div class="container">
		<div class="row">
			<div class="col-md-12 align-self-center">
				<ul class="breadcrumb custom-breadcrumb d-block text-center text-4">
					<li><a href="#">خانه</a></li>
					<li class="active">پروژه ها</li>
				</ul>
			</div>
			<div class="col-md-12 align-self-center p-static text-center mt-1">
				<h1 class="font-weight-bold text-color-secondary text-11">پروژه ها</h1>
			</div>
		</div>
	</div>
</section>

<div class="container container-lg pt-4">
	<div class="row">
		<div class="col">
			<p class="mb-1">نمونه کارهای ویژه</p>
			<h3 class="text-secondary font-weight-bold text-capitalize text-7 mb-3">نمونه‌کارهای ما</h3>
		</div>
	</div>
	<div class="row row-gutter-sm">
		<div class="col custom-portfolio">
			<ul class="nav nav-pills sort-source custom-nav-filter custom-center-pills mt-3 mb-4" data-sort-id="portfolio" data-option-key="filter" data-plugin-options="{'layoutMode': 'packery', 'filter': '*'}">
				<li class="nav-item my-1 active" data-option-value="*"><a class="nav-link active" href="#">مشاهده همه</a></li>
				<li class="nav-item my-1" data-option-value=".pre-construction"><a class="nav-link" href="#">پیش ساخت و ساز</a></li>
				<li class="nav-item my-1" data-option-value=".general-construction"><a class="nav-link" href="#">ساخت و ساز عمومی</a></li>
				<li class="nav-item my-1" data-option-value=".painting"><a class="nav-link" href="#">نقاشی</a></li>
				<li class="nav-item my-1" data-option-value=".plubing"><a class="nav-link" href="#">لوله کشی</a></li>
			</ul>
			<div class="sort-destination-loader sort-destination-loader-showing">
				<div id="loadMoreWrapper" class="row row-gutter-sm px-0 image-gallery sort-destination" data-sort-id="portfolio" data-total-pages="3">
					<div class="col-sm-6 isotope-item pre-construction">
						<div class="portfolio-item mb-3 pb-1">
							<a href="demo-construction-2-projects-details.html">
								<span class="thumb-info thumb-info-no-borders thumb-info-lighten thumb-info-bottom-info thumb-info-bottom-info-dark thumb-info-bottom-info-show-more thumb-info-no-zoom border-radius-0">
									<span class="thumb-info-wrapper">
										<img src="img/demos/construction-2/portfolio/portfolio-1.jpg" class="img-fluid" alt="">
									</span>
								</span>
							</a>
						</div>
					</div>
					<div class="col-sm-6 col-lg-3 isotope-item general-construction">
						<div class="portfolio-item mb-3 mb-md-5 mb-lg-3 pb-1">
							<a href="demo-construction-2-projects-details.html">
								<span class="thumb-info thumb-info-no-borders thumb-info-lighten thumb-info-bottom-info thumb-info-bottom-info-dark thumb-info-bottom-info-show-more thumb-info-no-zoom border-radius-0">
									<span class="thumb-info-wrapper">
										<img src="img/demos/construction-2/portfolio/portfolio-2.jpg" class="img-fluid" alt="">
									</span>
								</span>
							</a>
						</div>
					</div>
					<div class="col-sm-6 col-lg-3 isotope-item painting">
						<div class="portfolio-item mb-3 pb-1">
							<a href="demo-construction-2-projects-details.html">
								<span class="thumb-info thumb-info-no-borders thumb-info-lighten thumb-info-bottom-info thumb-info-bottom-info-dark thumb-info-bottom-info-show-more thumb-info-no-zoom border-radius-0">
									<span class="thumb-info-wrapper">
										<img src="img/demos/construction-2/portfolio/portfolio-3.jpg" class="img-fluid" alt="">
									</span>
								</span>
							</a>
						</div>
					</div>
					<div class="col-sm-6 col-lg-3 isotope-item plubing">
						<div class="portfolio-item mb-3 pb-1">
							<a href="demo-construction-2-projects-details.html">
								<span class="thumb-info thumb-info-no-borders thumb-info-lighten thumb-info-bottom-info thumb-info-bottom-info-dark thumb-info-bottom-info-show-more thumb-info-no-zoom border-radius-0">
									<span class="thumb-info-wrapper">
										<img src="img/demos/construction-2/portfolio/portfolio-4.jpg" class="img-fluid" alt="">
									</span>
								</span>
							</a>
						</div>
					</div>	
				</div>
			</div>
		</div>
	</div>
	<div class="row justify-content-center mb-5">
		<div id="loadMoreBtnWrapper" class="row text-center">
			<div class="col">
				<div id="loadMoreLoader" class="load-more-loader">
					<div class="bounce-loader">
						<div class="bounce1"></div>
						<div class="bounce2"></div>
						<div class="bounce3"></div>
					</div>
				</div>
				<button id="loadMore" class="btn btn-primary btn-outline custom-btn font-weight-extra-bold mt-4 px-5 py-3 border-width-4 appear-animation" data-appear-animation="fadeInUpShorter">بارگذاری بیشتر +
				</button>
			</div>
		</div>
	</div>
</div>
{% endblock %}
