{% load static %}
<div class="slider-container bg-color-grey rev_slider_wrapper"
     style="height: 650px">
    <div id="revolutionSlider"
         class="slider rev_slider manual"
         data-version="5.4.8"
         style="height: 650px">
        <ul>
            <li data-transition="fade">
                <img src="{% static 'img/demos/construction-2/slides/slide-1.jpg' %}"
                     alt=""
                     data-bgposition="center center"
                     data-bgfit="cover"
                     data-bgrepeat="no-repeat"
                     class="rev-slidebg">
                <div class="tp-caption tp-resizeme d-none d-sm-block"
                     data-frames='[{"delay":2000,"speed":1000,"from":"opacity:0;x:0;","to":"o:1;x:0;","ease":"Power1.easeIn"},{"delay":"wait","speed":300,"to":"opacity:0;fb:0;","ease":"Power1.easeIn"}]'
                     data-type="image"
                     data-x="center"
                     data-hoffset="0"
                     data-y="center"
                     data-voffset="0"
                     data-width="['auto']"
                     data-height="['auto']"
                     data-basealign="grid">
                    <img src="{% static 'img/demos/construction-2/slides/slide-1-2.png' %}"
                         alt="">
                </div>
                <div class="tp-caption font-weight-light text-color-dark ws-normal"
                     data-frames='[{"from":"opacity:0;","speed":500,"to":"o:0.7;","delay":2300,"ease":"Power2.easeInOut"},{"delay":"wait","speed":1000,"to":"y:[100%];","mask":"x:inherit;y:inherit;s:inherit;e:inherit;","ease":"Power2.easeInOut"}]'
                     data-x="center"
                     data-y="center"
                     data-voffset="['-65','-65','-65','-75']"
                     data-width="800"
                     data-fontsize="['18','18','18','24']"
                     data-lineheight="['26','26','26','26']"
                     data-textalign="center">{{ site_config.hero_subtitle }}</div>
                <h1 class="tp-caption font-weight-extra-bold text-color-secondary line ws-normal text-center"
                    data-frames='[{"delay":1500,"speed":400,"frame":"0","from":"opacity:0;x:50%;","to":"o:1;","ease":"Power3.easeInOut"},{"delay":"wait","speed":300,"frame":"999","to":"opacity:0;fb:0;","ease":"Power3.easeInOut"}]'
                    data-x="center"
                    data-y="center"
                    data-width="1200"
                    data-fontsize="['48','48','48','48']"
                    data-lineheight="['55','55','55','55']"
                    data-textalign="['right','right','right','center']">{{ site_config.hero_title }}</h1>
                <a
                    class="tp-caption d-inline-flex align-items-center btn btn-primary btn-outline font-weight-bold border-1"
                    data-hash
                    data-hash-offset="100"
                    href="{{ site_config.hero_cta_link }}""
                    data-frames='[{"delay":2500,"speed":2000,"frame":"0","from":"y:50%;opacity:0;","to":"y:0;o:1;","ease":"Power3.easeInOut"},{"delay":"wait","speed":300,"frame":"999","to":"opacity:0;fb:0;","ease":"Power3.easeInOut"}]'
                    data-x="center"
                    data-y="center"
                    data-voffset="['95','95','95','115']"
                    data-paddingtop="['16','16','16','24']"
                    data-paddingbottom="['16','16','16','24']"
                    data-paddingleft="46"
                    data-paddingright="46"
                    data-fontsize="['13','13','13','22']"
                data-lineheight="['20','20','20','20']">{{ site_config.hero_cta_text }}</a>
            </li>
            <li data-transition="fade">
                <img src="{% static 'img/demos/construction-2/slides/slide-2.jpg' %}"
                     alt=""
                     data-bgposition="center center"
                     data-bgfit="cover"
                     data-bgrepeat="no-repeat"
                     class="rev-slidebg">
                <div class="tp-caption font-weight-light text-color-dark ws-normal"
                     data-frames='[{"from":"opacity:0;","speed":500,"to":"o:0.7;","delay":2300,"ease":"Power2.easeInOut"},{"delay":"wait","speed":1000,"to":"y:[100%];","mask":"x:inherit;y:inherit;s:inherit;e:inherit;","ease":"Power2.easeInOut"}]'
                     data-x="center"
                     data-y="center"
                     data-voffset="['-65','-65','-65','-75']"
                     data-width="800"
                     data-fontsize="['18','18','18','24']"
                     data-lineheight="['26','26','26','26']"
                     data-textalign="center">{{ site_config.hero_subtitle }}</div>
                <h1 class="tp-caption font-weight-extra-bold text-color-secondary line ws-normal text-center"
                    data-frames='[{"delay":1500,"speed":400,"frame":"0","from":"opacity:0;x:50%;","to":"o:1;","ease":"Power3.easeInOut"},{"delay":"wait","speed":300,"frame":"999","to":"opacity:0;fb:0;","ease":"Power3.easeInOut"}]'
                    data-x="center"
                    data-y="center"
                    data-width="1200"
                    data-fontsize="['48','48','48','48']"
                    data-lineheight="['55','55','55','55']"
                    data-textalign="['right','right','right','center']">{{ site_config.company_name }}</h1>
                <a class="tp-caption d-inline-flex align-items-center btn btn-primary btn-outline font-weight-bold border-1"
                   data-hash
                   data-hash-offset="100"
                   href="{{ site_config.hero_cta_link }}"
                   data-frames='[{"delay":3000,"speed":2000,"frame":"0","from":"y:50%;opacity:0;","to":"y:0;o:1;","ease":"Power3.easeInOut"},{"delay":"wait","speed":300,"frame":"999","to":"opacity:0;fb:0;","ease":"Power3.easeInOut"}]'
                   data-x="center"
                   data-y="center"
                   data-voffset="['95','95','95','115']"
                   data-paddingtop="['16','16','16','24']"
                   data-paddingbottom="['16','16','16','24']"
                   data-paddingleft="46"
                   data-paddingright="46"
                   data-fontsize="['13','13','13','22']"
                   data-lineheight="['20','20','20','20']">{{ site_config.hero_cta_text }}</a>
            </li>
        </ul>
    </div>
</div>
