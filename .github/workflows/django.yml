name: Django CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff Lint
        run: uv run ruff check .

      - name: Ruff Format Check
        run: uv run ruff format . --check

      - name: DJLint
        run: uv run djlint templates --check

  test:
    name: Django Tests
    runs-on: ubuntu-latest

    needs: quality

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: datisdb
          POSTGRES_USER: datisdbuser
          POSTGRES_PASSWORD: datispassword

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U datisdbuser -d datisdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SETTINGS_MODULE: datis.settings

      SECRET_KEY: ci-secret-key
      DEBUG: "False"

      DB_NAME: datisdb
      DB_USER: datisdbuser
      DB_PASSWORD: datispassword
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: uv run python manage.py migrate --no-input

      - name: Django system checks
        run: uv run python manage.py check

      - name: Run Django tests
        run: uv run python manage.py test --verbosity=2